[project]
name = "correctable-agency"
version = "0.0.1"
description = "Research harness and benchmark for Correctable Agency"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["correctable_agency"]

[tool.pytest.ini_options]
testpaths = ["tests"]
